name: "PHPUnit tests"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  phpunit:
    name: "PHPUnit tests (${{ matrix.dependencies }}, ${{ matrix.php-version }}, ${{ matrix.operating-system }})"

    runs-on: ${{ matrix.operating-system }}

    timeout-minutes: 20

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "lowest"
          - "highest"
        php-version:
          - "8.4"
          - "8.5"
        operating-system:
          - "ubuntu-latest"
        experimental:
          - false
        include:
          - php-version: "8.6"
            dependencies: "lowest"
            operating-system: "ubuntu-latest"
            experimental: true
          - php-version: "8.6"
            dependencies: "highest"
            operating-system: "ubuntu-latest"
            experimental: true
          - php-version: "8.4"
            dependencies: "highest"
            operating-system: "windows-latest"
            experimental: false

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Tests"
        run: "vendor/bin/phpunit"

  coverage:
    # Coverage is measured on the oldest supported PHP version
    name: "Code coverage (highest, 8.4, ubuntu-latest)"

    runs-on: "ubuntu-latest"

    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "xdebug"
          php-version: "8.4"
          extensions: ffi, opcache
          ini-values: memory_limit=-1, ffi.enable=1, opcache.enable=1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-8.4-highest-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-8.4-highest-"

      - name: "Install highest dependencies"
        run: "composer update --no-interaction --no-progress"

      - name: "Tests with coverage"
        run: "vendor/bin/phpunit --exclude-group performance --exclude-group transformation-performance --exclude-testsuite ffi-driver --coverage-clover build/logs/clover.xml"

      - name: "Upload coverage to Codecov"
        uses: "codecov/codecov-action@v7"
        with:
          files: build/logs/clover.xml
          fail_ci_if_error: false
          slug: goaop/framework
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: framework

  demos:
    name: "Demos smoke test"

    runs-on: "ubuntu-latest"

    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.4"
          ini-values: memory_limit=-1, error_reporting=-1, display_errors=1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-8.4-highest-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-8.4-highest-"

      - name: "Install highest dependencies"
        run: "composer update --no-interaction --no-progress"

      - name: "Run every demo showcase with and without the weaver"
        run: |
          showcases=$(php -r 'require "vendor/autoload.php"; foreach ((new Demo\Showcase\ShowcaseCatalog())->all() as $showcase) echo $showcase->id, PHP_EOL;')
          for aop in on off; do
            for showcase in "" ${showcases}; do
              page="demo-${showcase:-index}-aop-${aop}.html"
              echo "::group::${showcase:-index} (AOP ${aop})"
              php -r "\$_COOKIE['aop'] = '${aop}'; \$_GET['showcase'] = '${showcase}'; include 'demos/index.php';" > "${page}"
              if grep -qiE '(fatal error|uncaught|warning|deprecated|notice)' "${page}"; then
                grep -iE '(fatal error|uncaught|warning|deprecated|notice)' "${page}"
                exit 1
              fi
              # A page cut short leaves the navigation and the AOP switch without their script
              if ! grep -q '</html>' "${page}"; then
                echo "The page is not rendered completely"
                tail -n 20 "${page}"
                exit 1
              fi
              echo "::endgroup::"
            done
          done
