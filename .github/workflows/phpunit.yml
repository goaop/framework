name: "PHPUnit tests"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  phpunit:
    name: "PHPUnit tests (${{ matrix.dependencies }}, ${{ matrix.php-version }}, ${{ matrix.operating-system }})"

    runs-on: ${{ matrix.operating-system }}

    timeout-minutes: 20

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "lowest"
          - "highest"
        php-version:
          - "8.4"
          - "8.5"
        operating-system:
          - "ubuntu-latest"
        experimental:
          - false
        include:
          - php-version: "8.6"
            dependencies: "lowest"
            operating-system: "ubuntu-latest"
            experimental: true
          - php-version: "8.6"
            dependencies: "highest"
            operating-system: "ubuntu-latest"
            experimental: true
          - php-version: "8.4"
            dependencies: "highest"
            operating-system: "windows-latest"
            experimental: false

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Tests"
        run: "vendor/bin/phpunit"

  coverage:
    # Coverage is measured on the oldest supported PHP version
    name: "Code coverage (highest, 8.4, ubuntu-latest)"

    runs-on: "ubuntu-latest"

    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "xdebug"
          php-version: "8.4"
          # ext-ffi for lisachenko/z-engine, so the zengine driver is covered too: FFI on, the JIT off (it rewrites
          # the executor internals z-engine hooks into), opcache inactive in the runner
          extensions: ffi, opcache
          ini-values: memory_limit=-1, ffi.enable=1, opcache.enable=1, opcache.enable_cli=0, opcache.jit=off, opcache.jit_buffer_size=0
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-8.4-highest-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-8.4-highest-"

      - name: "Install highest dependencies with lisachenko/z-engine"
        # The optional engine of the zengine driver, from the branch targeting PHP 8.4 (see docs/zengine-driver.md)
        run: |
          composer config repositories.zengine vcs https://github.com/lisachenko/z-engine
          composer require --dev --no-update lisachenko/z-engine:8.4.x-dev
          composer update --no-interaction --no-progress

      - name: "Tests with coverage"
        # The zengine group (excluded from the default run) is included here: its in-process tests weave stub
        # classes through the engine inside the runner, which is what covers the driver
        run: "vendor/bin/phpunit --exclude-group performance --exclude-group transformation-performance --coverage-clover build/logs/clover.xml"

      - name: "Upload coverage to Codecov"
        uses: "codecov/codecov-action@v7"
        with:
          files: build/logs/clover.xml
          fail_ci_if_error: false
          slug: goaop/framework
          token: ${{ secrets.CODECOV_TOKEN }}

  demos:
    name: "Demos smoke test"

    runs-on: "ubuntu-latest"

    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.4"
          ini-values: memory_limit=-1, error_reporting=-1, display_errors=1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "composer-${{ runner.os }}-php-8.4-highest-${{ hashFiles('composer.json') }}"
          restore-keys: "composer-${{ runner.os }}-php-8.4-highest-"

      - name: "Install highest dependencies"
        run: "composer update --no-interaction --no-progress"

      - name: "Run every demo showcase through the weaver"
        run: |
          for showcase in $(grep -o "case '[a-z-]*'" demos/index.php | cut -d"'" -f2); do
            echo "::group::${showcase}"
            php -r "\$_GET['showcase'] = '${showcase}'; include 'demos/index.php';" > "demo-${showcase}.html"
            if grep -qiE '(fatal error|uncaught|warning|deprecated|notice)' "demo-${showcase}.html"; then
              grep -iE '(fatal error|uncaught|warning|deprecated|notice)' "demo-${showcase}.html"
              exit 1
            fi
            echo "::endgroup::"
          done
