name: "PHPUnit tests"

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  phpunit:
    name: "PHPUnit tests (${{ matrix.dependencies }}, ${{ matrix.php-version }}, ${{ matrix.operating-system }})"

    runs-on: ${{ matrix.operating-system }}

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "lowest"
          - "highest"
        php-version:
          - "8.4"
          - "8.5"
        operating-system:
          - "ubuntu-latest"
        experimental:
          - false
        include:
          - php-version: "8.6"
            dependencies: "lowest"
            operating-system: "ubuntu-latest"
            experimental: true
          - php-version: "8.6"
            dependencies: "highest"
            operating-system: "ubuntu-latest"
            experimental: true

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2, cs2pr

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}"
          restore-keys: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}"

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: "composer update --prefer-lowest --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Install locked dependencies"
        if: ${{ matrix.dependencies == 'locked' }}
        run: "composer install --no-interaction --no-progress${{ matrix.experimental && ' --ignore-platform-req=php+' || '' }}"

      - name: "Tests"
        run: "vendor/bin/phpunit"

  coverage:
    name: "Code coverage (highest, 8.5, ubuntu-latest)"

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "xdebug"
          php-version: "8.5"
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: "Cache dependencies"
        uses: "actions/cache@v6"
        with:
          path: |
            ~/.composer/cache
            vendor
          key: "php-8.5-highest-coverage"
          restore-keys: |
            php-8.5-highest-coverage
            php-8.5-highest

      - name: "Install highest dependencies"
        run: "composer update --no-interaction --no-progress"

      - name: "Tests with coverage"
        run: "vendor/bin/phpunit --coverage-clover build/logs/clover.xml"

      - name: "Upload coverage to Codecov"
        uses: "codecov/codecov-action@v5"
        with:
          files: build/logs/clover.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
